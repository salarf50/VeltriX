name: Validate VeltriX Mold Cost App

on:
  push:
    branches: [mold-cost-app]
    paths:
      - 'apps/mold-cost/**'
      - '.github/workflows/deploy-mold-cost-app.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mold-cost
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mold-cost/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Test calculator and build Worker
        run: npm test && npm run build

      - name: Run API smoke tests against an isolated local D1
        env:
          TELEGRAM_BRIDGE_SECRET: local-telegram-bridge-test
          BALEH_BRIDGE_SECRET: local-bale-bridge-test
        run: |
          set -euo pipefail
          cat > .dev.vars <<'EOF'
          TELEGRAM_BRIDGE_SECRET=local-telegram-bridge-test
          BALEH_BRIDGE_SECRET=local-bale-bridge-test
          EOF
          npx wrangler d1 migrations apply veltrix-mold-cost-db --local --config wrangler.jsonc
          npx wrangler dev --local --ip 127.0.0.1 --port 3000 --config wrangler.jsonc > /tmp/mold-cost-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/health >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/mold-cost-worker.log; exit 1; fi
          npm run test:integration
