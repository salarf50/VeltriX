name: Build Android TWA APK

on:
  push:
    branches:
      - mold-cost-android-build
    paths:
      - 'android-twa/**'
      - '.github/workflows/build-android-twa.yml'

permissions:
  contents: read

jobs:
  build-unsigned-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Android wrapper source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36 and Build Tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            'platforms;android-36' 'build-tools;36.1.0'

      - name: Build release APK and align it
        shell: bash
        working-directory: android-twa
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease
          "$ANDROID_HOME/build-tools/36.1.0/zipalign" -f -v 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app-release-unsigned-aligned.apk

      - name: Upload unsigned APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: veltrix-mold-cost-unsigned-apk
          path: android-twa/app-release-unsigned-aligned.apk
          if-no-files-found: error
          retention-days: 7
